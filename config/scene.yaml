# =====================================================================
# Mô tả môi trường thao tác — Bài 03 (UR3e + tay gắp + camera, 5 khối, 3 zone)
#
# Đơn vị: mét / radian. Hệ toạ độ: base_link của UR (robot spawn tại gốc
# world của Gazebo nên world ≡ base_link).
#
# QUAN TRỌNG: "spawn" (vị trí ban đầu của các khối) CHỈ được launch file dùng
# để đặt khối vào Gazebo. Chương trình điều khiển KHÔNG đọc các giá trị này:
# vị trí khối và trạng thái zone đều lấy từ CAMERA (ur3_llm_control/perception.py).
# Phần còn lại (bàn, zone, camera, tay gắp) là thông tin cố định của hạ tầng.
# =====================================================================

frame_id: base_link

table:
  center: [0.40, 0.00, 0.025]   # tâm hộp
  size:   [0.44, 0.76, 0.05]    # dài x rộng x cao -> mặt bàn ở z = 0.05
  rgba:   [0.80, 0.78, 0.72, 1.0]   # màu nhạt, ít bão hoà để không lẫn với màu khối

cube_size: 0.04                  # cạnh khối lập phương (m)
cube_mass: 0.05                  # kg (khối là vật động lực học thật, có trọng lực)
cube_friction: 1.2

objects:
  # color   : tên màu (dùng cho prompt + tách màu)
  # hsv     : ngưỡng tách màu [h_min, h_max] (độ, 0..360; h_min > h_max = vòng qua 0)
  # spawn   : [x, y, yaw] lúc spawn trong Gazebo (CHỈ launch dùng)
  red_cube:
    color: red
    rgba: [0.85, 0.08, 0.08, 1.0]
    hue: [340, 15]
    spawn: [0.24, 0.12, 0.30]
  yellow_cube:
    color: yellow
    rgba: [0.92, 0.82, 0.08, 1.0]
    hue: [40, 70]
    spawn: [0.25, -0.10, -0.20]
  blue_cube:
    color: blue
    rgba: [0.08, 0.25, 0.90, 1.0]
    hue: [205, 245]
    spawn: [0.36, 0.00, 0.10]        # đang chiếm zone_b -> tình huống demo
  green_cube:
    color: green
    rgba: [0.10, 0.70, 0.15, 1.0]
    hue: [90, 160]
    spawn: [0.36, -0.15, 0.0]        # đang chiếm zone_c
  purple_cube:
    color: purple
    rgba: [0.55, 0.10, 0.80, 1.0]
    hue: [255, 300]
    spawn: [0.27, 0.26, 0.40]

zones:
  # Tâm (x, y) của từng vùng đặt vật (hạ tầng cố định, có tấm màu trên bàn)
  zone_a:
    label: "Zone A"
    center: [0.36, 0.15]
    rgba: [0.35, 0.35, 0.38, 1.0]
  zone_b:
    label: "Zone B"
    center: [0.36, 0.00]
    rgba: [0.35, 0.35, 0.38, 1.0]
  zone_c:
    label: "Zone C"
    center: [0.36, -0.15]
    rgba: [0.35, 0.35, 0.38, 1.0]

zone_size: 0.08                  # cạnh ô vuông vẽ vùng
occupancy_radius: 0.045          # tâm khối cách tâm zone < giá trị này => zone bị chiếm

camera:
  # Camera RGB cố định nhìn thẳng xuống bàn (spawn bởi launch, ảnh qua ros_gz_bridge).
  # pose = [x, y, z, roll, pitch, yaw] của link camera (trục x của link = hướng nhìn).
  # Đây là tham số ngoại (extrinsic) của camera, coi như đã hiệu chuẩn.
  name: overhead_camera
  pose: [0.40, 0.00, 1.00, 0.0, 1.5708, 0.0]
  horizontal_fov: 1.0
  width: 640
  height: 480
  update_rate: 10
  image_topic: /overhead_camera/image
  info_topic: /overhead_camera/camera_info

perception:
  min_saturation: 0.45           # pixel phải đủ "đậm màu"
  min_value: 0.25                # và đủ sáng
  min_area_ratio: 0.35           # diện tích blob / diện tích kỳ vọng tối thiểu (lọc nhiễu)
  visible_area_ratio: 0.70       # nhỏ hơn => coi là bị che khuất một phần
  table_margin: 0.0              # chỉ nhận điểm nằm trên mặt bàn

free_space:
  # Vùng tìm "vị trí tạm" (temporary_position) trên bàn, trong tầm với của tay máy
  x_range: [0.21, 0.45]
  y_range: [-0.30, 0.30]
  step: 0.02
  min_dist_objects: 0.10         # cách tâm các khối khác (đủ chỗ cho ngón tay mở)
  min_dist_zones: 0.10           # không đặt đè lên zone
  max_reach: 0.43                # bán kính tối đa tính từ trục robot (m)

gripper:
  joints: [gripper_left_finger_joint, gripper_right_finger_joint]
  command_topic: /gripper_controller/commands
  open_position: 0.040           # mỗi ngón cách tâm 4 cm => khe hở 8 cm
  # Đóng: ngón trái (tựa, 40 N) tới đúng nửa cạnh khối, ngón phải (kẹp, 15 N) đóng hết
  # -> bị khối chặn lại, ép khối vào ngón tựa => khối luôn nằm giữa tay gắp.
  anchor_position: 0.020         # = cube_size / 2
  close_position: 0.0
  grasp_min_gap: 0.030           # khe hở sau khi đóng >= giá trị này => đang kẹp được vật
  grasp_max_gap: 0.050
  settle_time: 2.5               # thời gian tối đa chờ ngón dừng (s)
  tcp_offset: 0.062              # khoảng cách tool0 -> tâm vùng kẹp (dọc trục z tool0)
  fingertip_offset: 0.080        # khoảng cách tool0 -> đầu ngón

motion:
  approach_height: 0.10          # độ cao pre-grasp phía trên điểm kẹp (m)
  grasp_height: 0.075            # độ cao (z) của tâm vùng kẹp khi gắp (đầu ngón cách bàn ~7 mm)
  release_height: 0.078          # độ cao tâm vùng kẹp khi thả (khối cách bàn ~3 mm)
  # Hướng tool0 chúc xuống (quaternion x, y, z, w trong base_link), yaw = 0
  tool_down_quat_xyzw: [1.0, 0.0, 0.0, 0.0]
  # Tư thế home: tay dựng đứng phía trên đế robot -> KHÔNG che camera nhìn bàn
  home_joints: [0.0, -1.5708, 0.0, -1.5708, 0.0, 0.0]
  # Seed cho IK (tư thế chúc xuống phía trước bàn) -> luôn ra cùng một nhánh nghiệm
  ik_seed_joints: [0.0, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]
  max_velocity: 0.3
  max_acceleration: 0.3
  cartesian_max_step: 0.005
  cartesian_min_fraction: 0.95
  planning_time: 5.0
  planning_attempts: 10
